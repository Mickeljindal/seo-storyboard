<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
  <defs>
    <radialGradient id="cgp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F1AF3" stop-opacity="0.38"/>
      <stop offset="70%" stop-color="#4F1AF3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cvig" cx="50%" cy="26%" r="95%">
      <stop offset="40%" stop-color="#00040f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00040f" stop-opacity="0.72"/>
    </radialGradient>
    <pattern id="cgrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <marker id="carrow" markerWidth="16" markerHeight="16" refX="9" refY="8" orient="auto">
      <path d="M0 1 L13 8 L0 15" fill="none" stroke="#7C5CFF" stroke-width="2.5"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#000f27"/>
  <rect width="1200" height="675" fill="url(#cgrid)"/>
  <circle cx="600" cy="120" r="440" fill="url(#cgp)"/>
  <rect width="1200" height="675" fill="url(#cvig)"/>

  <!-- Header -->
  <g transform="translate(60,64)">
    <rect x="0" y="-18" width="40" height="4" rx="2" fill="#7C5CFF"/>
    <text x="52" y="-11" fill="#7C5CFF" font-size="16" font-weight="600" letter-spacing="2.5">THE AGENCY MATH</text>
    <text x="0" y="26" fill="#ffffff" font-size="36" font-weight="700" letter-spacing="-0.5">Stop paying (and logging in) per project</text>
  </g>
  <text x="1140" y="58" text-anchor="end" fill="#ffffff" font-size="26" font-weight="700">kloudbean<tspan fill="#7C5CFF">.</tspan></text>

  <!-- BEFORE -->
  <g transform="translate(60,150)">
    <rect x="0" y="0" width="486" height="452" rx="20" fill="#ffffff08" stroke="#ffffff26"/>
    <text x="26" y="42" fill="#E4B32F" font-size="15" font-weight="700" letter-spacing="2">BEFORE</text>
    <text x="26" y="70" fill="#9aa4c6" font-size="15">A platform per client. A bill per platform.</text>
    <g font-size="16" font-weight="600" fill="#e8ecfb">
      <g transform="translate(26,92)">
        <rect width="210" height="72" rx="12" fill="#ffffff0d" stroke="#ffffff1f"/>
        <text x="18" y="34">Vercel</text><text x="18" y="56" fill="#E4B32F" font-size="13">$ monthly</text>
      </g>
      <g transform="translate(250,92)">
        <rect width="210" height="72" rx="12" fill="#ffffff0d" stroke="#ffffff1f"/>
        <text x="18" y="34">Netlify</text><text x="18" y="56" fill="#E4B32F" font-size="13">$ monthly</text>
      </g>
      <g transform="translate(26,176)">
        <rect width="210" height="72" rx="12" fill="#ffffff0d" stroke="#ffffff1f"/>
        <text x="18" y="34">Railway</text><text x="18" y="56" fill="#E4B32F" font-size="13">$ metered</text>
      </g>
      <g transform="translate(250,176)">
        <rect width="210" height="72" rx="12" fill="#ffffff0d" stroke="#ffffff1f"/>
        <text x="18" y="34">Heroku</text><text x="18" y="56" fill="#E4B32F" font-size="13">$ per dyno</text>
      </g>
      <g transform="translate(26,260)">
        <rect width="210" height="72" rx="12" fill="#ffffff0d" stroke="#ffffff1f"/>
        <text x="18" y="34">WP host</text><text x="18" y="56" fill="#E4B32F" font-size="13">$ per site</text>
      </g>
      <g transform="translate(250,260)">
        <rect width="210" height="72" rx="12" fill="#ffffff0d" stroke="#ffffff1f"/>
        <text x="18" y="34">DB host</text><text x="18" y="56" fill="#E4B32F" font-size="13">$ per instance</text>
      </g>
    </g>
    <line x1="26" y1="356" x2="460" y2="356" stroke="#ffffff1a" stroke-width="1"/>
    <text x="26" y="392" fill="#E4B32F" font-size="18" font-weight="700">12 logins · 12 invoices</text>
    <text x="26" y="418" fill="#8f9ac2" font-size="14">Different dashboards, quotas and renewal dates for every project.</text>
  </g>

  <!-- Arrow -->
  <line x1="560" y1="376" x2="654" y2="376" stroke="#7C5CFF" stroke-width="3" marker-end="url(#carrow)"/>

  <!-- AFTER -->
  <g transform="translate(654,150)">
    <rect x="0" y="0" width="486" height="452" rx="20" fill="#4F1AF312" stroke="#7C5CFF55"/>
    <text x="26" y="42" fill="#40B75F" font-size="15" font-weight="700" letter-spacing="2">AFTER</text>
    <text x="26" y="70" fill="#c9d2ee" font-size="15">One managed server. One console. One bill.</text>
    <rect x="26" y="92" width="434" height="188" rx="14" fill="#ffffff08" stroke="#ffffff1f"/>
    <text x="46" y="122" fill="#ffffff" font-size="17" font-weight="700">kloudbean<tspan fill="#7C5CFF">.</tspan> <tspan fill="#9aa4c6" font-size="13" font-weight="500">console</tspan></text>
    <g font-size="15" font-weight="600" fill="#e8ecfb">
      <rect x="46" y="138" width="188" height="46" rx="10" fill="#ffffff10" stroke="#ffffff24"/><text x="64" y="167">WordPress</text>
      <rect x="252" y="138" width="188" height="46" rx="10" fill="#ffffff10" stroke="#ffffff24"/><text x="270" y="167">Next.js</text>
      <rect x="46" y="196" width="188" height="46" rx="10" fill="#ffffff10" stroke="#ffffff24"/><text x="64" y="225">Laravel + API</text>
      <rect x="252" y="196" width="188" height="46" rx="10" fill="#4F1AF31f" stroke="#7C5CFF55"/><text x="270" y="225" fill="#cbb8ff">Managed DBs</text>
    </g>
    <g transform="translate(26,312)">
      <circle cx="14" cy="10" r="13" fill="#40B75F"/>
      <path d="M8 10 l4 4 l7 -8" fill="none" stroke="#04140a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="16" fill="#ffffff" font-size="19" font-weight="700">1 console · 1 invoice</text>
    </g>
    <text x="26" y="366" fill="#c9d2ee" font-size="14">Add, isolate and hand off clients from one place —</text>
    <text x="26" y="388" fill="#c9d2ee" font-size="14">white-label it as your own, from $8/mo.</text>
  </g>
</svg>
