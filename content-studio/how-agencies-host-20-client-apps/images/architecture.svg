<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
  <defs>
    <radialGradient id="agp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F1AF3" stop-opacity="0.42"/>
      <stop offset="70%" stop-color="#4F1AF3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="avig" cx="60%" cy="30%" r="95%">
      <stop offset="40%" stop-color="#00040f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00040f" stop-opacity="0.72"/>
    </radialGradient>
    <pattern id="agrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto">
      <path d="M0 1 L9 6 L0 11" fill="none" stroke="#7C5CFF" stroke-width="2"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#000f27"/>
  <rect width="1200" height="720" fill="url(#agrid)"/>
  <circle cx="900" cy="120" r="440" fill="url(#agp)"/>
  <rect width="1200" height="720" fill="url(#avig)"/>

  <!-- Header -->
  <g transform="translate(60,66)">
    <rect x="0" y="-18" width="40" height="4" rx="2" fill="#7C5CFF"/>
    <text x="52" y="-11" fill="#7C5CFF" font-size="16" font-weight="600" letter-spacing="2.5">HOW IT FITS TOGETHER</text>
    <text x="0" y="26" fill="#ffffff" font-size="36" font-weight="700" letter-spacing="-0.5">One managed server, isolated per client</text>
  </g>
  <text x="1140" y="60" text-anchor="end" fill="#ffffff" font-size="26" font-weight="700">kloudbean<tspan fill="#7C5CFF">.</tspan></text>

  <!-- Visitors -->
  <g transform="translate(60,300)">
    <rect x="0" y="0" width="150" height="120" rx="16" fill="#ffffff0a" stroke="#ffffff26"/>
    <circle cx="75" cy="46" r="22" fill="none" stroke="#e8ecfb" stroke-width="2"/>
    <path d="M53 46 h44 M75 24 v44 M60 30 a40 40 0 0 0 0 32 M90 30 a40 40 0 0 1 0 32" fill="none" stroke="#e8ecfb" stroke-width="1.6"/>
    <text x="75" y="98" text-anchor="middle" fill="#e8ecfb" font-size="18" font-weight="600">Visitors</text>
  </g>
  <line x1="214" y1="360" x2="256" y2="360" stroke="#7C5CFF" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Edge: CDN + FLB -->
  <g transform="translate(262,286)">
    <rect x="0" y="0" width="182" height="148" rx="16" fill="#ffffff0a" stroke="#ffffff26"/>
    <text x="91" y="30" text-anchor="middle" fill="#7C5CFF" font-size="13" font-weight="600" letter-spacing="1.5">EDGE</text>
    <rect x="18" y="44" width="146" height="40" rx="10" fill="#ffffff10" stroke="#ffffff1f"/>
    <text x="91" y="69" text-anchor="middle" fill="#e8ecfb" font-size="16" font-weight="600">Cloudflare CDN</text>
    <rect x="18" y="92" width="146" height="40" rx="10" fill="#ffffff10" stroke="#ffffff1f"/>
    <text x="91" y="117" text-anchor="middle" fill="#e8ecfb" font-size="15" font-weight="600">Load Balancer</text>
  </g>
  <line x1="448" y1="360" x2="492" y2="360" stroke="#7C5CFF" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Managed server container -->
  <g transform="translate(498,150)">
    <rect x="0" y="0" width="642" height="470" rx="20" fill="#ffffff08" stroke="#ffffff26" stroke-width="1.5"/>
    <text x="26" y="38" fill="#7C5CFF" font-size="14" font-weight="600" letter-spacing="2">MANAGED SERVER · YOUR CLOUD · YOUR REGION</text>

    <!-- client row template -->
    <g font-family="Poppins, 'Segoe UI', Arial, sans-serif">
      <!-- Client A -->
      <g transform="translate(26,58)">
        <rect x="0" y="0" width="590" height="96" rx="12" fill="#ffffff0d" stroke="#ffffff1f"/>
        <text x="20" y="38" fill="#ffffff" font-size="18" font-weight="700">Client A</text>
        <text x="20" y="66" fill="#8f9ac2" font-size="13">own user · own SSL</text>
        <rect x="150" y="26" width="150" height="46" rx="10" fill="#ffffff12" stroke="#ffffff24"/>
        <text x="225" y="55" text-anchor="middle" fill="#e8ecfb" font-size="16" font-weight="600">WordPress</text>
        <rect x="316" y="26" width="132" height="46" rx="10" fill="#4F1AF31f" stroke="#7C5CFF55"/>
        <text x="382" y="55" text-anchor="middle" fill="#cbb8ff" font-size="15" font-weight="600">MySQL</text>
        <text x="470" y="45" fill="#40B75F" font-size="13" font-weight="600">&#9679; isolated</text>
        <text x="470" y="64" fill="#8f9ac2" font-size="12">own process</text>
      </g>
      <!-- Client B -->
      <g transform="translate(26,166)">
        <rect x="0" y="0" width="590" height="96" rx="12" fill="#ffffff0d" stroke="#ffffff1f"/>
        <text x="20" y="38" fill="#ffffff" font-size="18" font-weight="700">Client B</text>
        <text x="20" y="66" fill="#8f9ac2" font-size="13">own user · own SSL</text>
        <rect x="150" y="26" width="150" height="46" rx="10" fill="#ffffff12" stroke="#ffffff24"/>
        <text x="225" y="55" text-anchor="middle" fill="#e8ecfb" font-size="16" font-weight="600">Next.js</text>
        <rect x="316" y="26" width="132" height="46" rx="10" fill="#4F1AF31f" stroke="#7C5CFF55"/>
        <text x="382" y="55" text-anchor="middle" fill="#cbb8ff" font-size="15" font-weight="600">Postgres</text>
        <text x="470" y="45" fill="#40B75F" font-size="13" font-weight="600">&#9679; isolated</text>
        <text x="470" y="64" fill="#8f9ac2" font-size="12">own process</text>
      </g>
      <!-- Client C -->
      <g transform="translate(26,274)">
        <rect x="0" y="0" width="590" height="96" rx="12" fill="#ffffff0d" stroke="#ffffff1f"/>
        <text x="20" y="38" fill="#ffffff" font-size="18" font-weight="700">Client C</text>
        <text x="20" y="66" fill="#8f9ac2" font-size="13">own user · own SSL</text>
        <rect x="150" y="26" width="150" height="46" rx="10" fill="#ffffff12" stroke="#ffffff24"/>
        <text x="225" y="55" text-anchor="middle" fill="#e8ecfb" font-size="16" font-weight="600">Laravel</text>
        <rect x="316" y="26" width="132" height="46" rx="10" fill="#4F1AF31f" stroke="#7C5CFF55"/>
        <text x="382" y="55" text-anchor="middle" fill="#cbb8ff" font-size="15" font-weight="600">Redis</text>
        <text x="470" y="45" fill="#40B75F" font-size="13" font-weight="600">&#9679; isolated</text>
        <text x="470" y="64" fill="#8f9ac2" font-size="12">own process</text>
      </g>
      <!-- + more -->
      <g transform="translate(26,382)">
        <rect x="0" y="0" width="590" height="62" rx="12" fill="none" stroke="#ffffff26" stroke-dasharray="6 6"/>
        <text x="295" y="38" text-anchor="middle" fill="#9aa4c6" font-size="17" font-weight="600">+ 17 more client apps on the same box</text>
      </g>
    </g>
  </g>

  <!-- Managed-by strip -->
  <g transform="translate(60,656)">
    <rect x="0" y="0" width="1080" height="44" rx="12" fill="#4F1AF314" stroke="#7C5CFF44"/>
    <text x="24" y="29" fill="#cbd3ee" font-size="16" font-weight="500">Kloudbean handles the box: OS patching · security · backups · scaling · free SSL · CI/CD — with unlimited DevOps hours.</text>
  </g>
</svg>
