<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
  <defs>
    <radialGradient id="pgp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F1AF3" stop-opacity="0.38"/>
      <stop offset="70%" stop-color="#4F1AF3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pvig" cx="55%" cy="28%" r="95%">
      <stop offset="42%" stop-color="#00040f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00040f" stop-opacity="0.70"/>
    </radialGradient>
    <pattern id="pgrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="560" fill="#000f27"/>
  <rect width="1200" height="560" fill="url(#pgrid)"/>
  <circle cx="600" cy="70" r="420" fill="url(#pgp)"/>
  <rect width="1200" height="560" fill="url(#pvig)"/>

  <g transform="translate(48,64)">
    <rect x="0" y="-18" width="40" height="4" rx="2" fill="#7C5CFF"/>
    <text x="52" y="-11" fill="#7C5CFF" font-size="15" font-weight="600" letter-spacing="2.5">BEFORE REAL USERS TOUCH IT</text>
    <text x="0" y="26" fill="#ffffff" font-size="34" font-weight="700" letter-spacing="-0.5">What production actually needs</text>
  </g>
  <text x="1152" y="56" text-anchor="end" fill="#ffffff" font-size="24" font-weight="700">kloudbean<tspan fill="#7C5CFF">.</tspan></text>

  <rect x="48" y="132" width="1104" height="392" rx="20" fill="#ffffff08" stroke="#ffffff26" stroke-width="1.5"/>

  <g font-family="Poppins, 'Segoe UI', Arial, sans-serif">
    <!-- row 1 -->
    <g transform="translate(96,196)">
      <circle cx="12" cy="8" r="14" fill="#40B75F"/><path d="M6 8 l4 4 l8 -9" fill="none" stroke="#04140a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="6" fill="#ffffff" font-size="19" font-weight="700">A real domain + SSL</text>
      <text x="40" y="32" fill="#9aa4c6" font-size="15">HTTPS on your own domain, renewed automatically.</text>
    </g>
    <g transform="translate(624,196)">
      <circle cx="12" cy="8" r="14" fill="#40B75F"/><path d="M6 8 l4 4 l8 -9" fill="none" stroke="#04140a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="6" fill="#ffffff" font-size="19" font-weight="700">An always-on process</text>
      <text x="40" y="32" fill="#9aa4c6" font-size="15">Runs 24/7 and restarts on crash — not your laptop.</text>
    </g>
    <!-- row 2 -->
    <g transform="translate(96,300)">
      <circle cx="12" cy="8" r="14" fill="#40B75F"/><path d="M6 8 l4 4 l8 -9" fill="none" stroke="#04140a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="6" fill="#ffffff" font-size="19" font-weight="700">A real managed database</text>
      <text x="40" y="32" fill="#9aa4c6" font-size="15">Not a local file — backed up, secured, next to the app.</text>
    </g>
    <g transform="translate(624,300)">
      <circle cx="12" cy="8" r="14" fill="#40B75F"/><path d="M6 8 l4 4 l8 -9" fill="none" stroke="#04140a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="6" fill="#ffffff" font-size="19" font-weight="700">Secrets kept out of code</text>
      <text x="40" y="32" fill="#9aa4c6" font-size="15">API keys set safely as environment config.</text>
    </g>
    <!-- row 3 -->
    <g transform="translate(96,404)">
      <circle cx="12" cy="8" r="14" fill="#40B75F"/><path d="M6 8 l4 4 l8 -9" fill="none" stroke="#04140a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="6" fill="#ffffff" font-size="19" font-weight="700">Automatic backups</text>
      <text x="40" y="32" fill="#9aa4c6" font-size="15">A bad deploy or query isn't fatal (Premium and up).</text>
    </g>
    <g transform="translate(624,404)">
      <circle cx="12" cy="8" r="14" fill="#40B75F"/><path d="M6 8 l4 4 l8 -9" fill="none" stroke="#04140a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="6" fill="#ffffff" font-size="19" font-weight="700">Room to scale</text>
      <text x="40" y="32" fill="#9aa4c6" font-size="15">Add resources when traffic shows up — no rebuild.</text>
    </g>
  </g>
</svg>
