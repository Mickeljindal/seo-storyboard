<title id="kbTitle">Kloudbean hosting architecture</title>
<desc id="kbDesc">Cloudflare handles DNS, CDN and DDoS protection, then traffic enters over HTTPS 443. Inside a single compute engine: NGINX reverse proxies and load balances, serving a cache hit from Varnish and sending a cache miss to Apache and PHP-FPM. Also inside that same compute engine, any number of applications run, each isolated with its own Git repository, PHP-FPM worker pool and system user. Each application connects out to its own dedicated MariaDB database and its own Redis cache, with backups and recovery alongside. BitNinja secures the compute engine.</desc>

<figcaption>
  Cloudflare handles DNS, CDN and DDoS, then traffic enters over HTTPS 443. Everything inside the
  compute engine is one server: NGINX reverse proxies and load balances, a cache hit is served by
  Varnish, a miss goes to Apache and PHP-FPM, and the applications themselves run there too, each in
  its own isolated environment with its own system user, filesystem permissions and worker pool. Each
  application connects out to its own dedicated database and cache. The stack shown is the PHP and
  WordPress path; Node, Python, Ruby, Java, Go and static apps run the same model with their own
  runtime in place of PHP-FPM. Managed means Kloudbean runs the server, stack, SSL, backups and
  patching, while your application code and data stay yours.
</figcaption>
