<title id="kbTitle">Kloudbean hosting architecture</title>
<desc id="kbDesc">Request flow from Cloudflare over HTTPS 443 into NGINX, which branches to Varnish on a cache hit and Apache on a cache miss. Apache serves any number of applications, each isolated with its own Git repository, PHP-FPM worker pool and system user. Each application connects to its own dedicated MariaDB database in the database layer and its own Redis instance in the cache layer, with backups and disaster recovery alongside. BitNinja secures the compute engine.</desc>

<figcaption>
  Request path: Cloudflare handles DNS, CDN and DDoS, then HTTPS 443 into NGINX, which serves a
  cache hit from Varnish and sends a miss to Apache and PHP-FPM. Every application is isolated on
  the same server with its own system user, filesystem permissions and worker pool, and each one
  connects to its own dedicated database and cache. The stack shown is the PHP and WordPress path;
  Node, Python, Ruby, Java, Go and static apps run the same model with their own runtime in place
  of PHP-FPM. Managed means Kloudbean runs the server, stack, SSL, backups and patching, while your
  application code and data stay yours.
