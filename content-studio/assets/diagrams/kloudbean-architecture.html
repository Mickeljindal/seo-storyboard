<title id="kbT">Kloudbean hosting architecture, technical reference</title>
<desc id="kbD">Request path: Cloudflare provides DNS, CDN and DDoS protection, then traffic arrives over HTTPS on port 443 at NGINX, which reverse proxies and load balances. A cache hit is served by Varnish; a cache miss is passed to Apache, which hands execution to PHP-FPM. Applications sit in the same compute engine, each in an isolated environment with its own Git repository, PHP-FPM worker pool and system user. Each application opens its own connection to a dedicated MariaDB database on port 3306 and a dedicated Redis instance on port 6379. Backups, off-site copies, restore procedures and staging sit alongside the data tiers. BitNinja enforces security at the compute engine boundary.</desc>

<figcaption>
  Cloudflare fronts DNS, CDN and DDoS protection. Traffic arrives over HTTPS on 443 at NGINX, which
  reverse proxies and load balances: a cache hit is served by Varnish, a miss is passed to Apache,
  which hands execution to PHP-FPM. Applications sit in the same compute engine, each in an isolated
  environment with its own Git repository, PHP-FPM worker pool and system user. Each application
  opens its own connections to a dedicated MariaDB database and a dedicated Redis instance. The PHP
  path is shown; Node, Python, Ruby, Java, Go and static applications substitute their own runtime
  for Apache and PHP-FPM.
</figcaption>
