<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
  <defs>
    <radialGradient id="sgp" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#4F1AF3" stop-opacity="0.40"/><stop offset="70%" stop-color="#4F1AF3" stop-opacity="0"/></radialGradient>
    <radialGradient id="svig" cx="55%" cy="30%" r="95%"><stop offset="42%" stop-color="#00040f" stop-opacity="0"/><stop offset="100%" stop-color="#00040f" stop-opacity="0.70"/></radialGradient>
    <pattern id="sgrid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/></pattern>
    <marker id="sarrow" markerWidth="14" markerHeight="14" refX="8" refY="7" orient="auto"><path d="M0 1 L11 7 L0 13" fill="none" stroke="#7C5CFF" stroke-width="2.4"/></marker>
  </defs>

  <rect width="1200" height="470" fill="#000f27"/>
  <rect width="1200" height="470" fill="url(#sgrid)"/>
  <circle cx="850" cy="60" r="360" fill="url(#sgp)"/>
  <rect width="1200" height="470" fill="url(#svig)"/>

  <g transform="translate(48,58)">
    <rect x="0" y="-18" width="40" height="4" rx="2" fill="#7C5CFF"/>
    <text x="52" y="-11" fill="#7C5CFF" font-size="15" font-weight="600" letter-spacing="2.5">FOUR STEPS</text>
    <text x="0" y="24" fill="#ffffff" font-size="32" font-weight="700" letter-spacing="-0.5">Lovable app to your own server</text>
  </g>
  <text x="1152" y="54" text-anchor="end" fill="#ffffff" font-size="24" font-weight="700">kloudbean<tspan fill="#7C5CFF">.</tspan></text>

  <g font-family="Poppins, 'Segoe UI', Arial, sans-serif">
    <g transform="translate(40,150)">
      <rect width="232" height="196" rx="16" fill="#ffffff0a" stroke="#ffffff26"/>
      <circle cx="34" cy="40" r="18" fill="#4F1AF3"/><text x="34" y="47" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">1</text>
      <text x="66" y="46" fill="#7C5CFF" font-size="13" font-weight="600" letter-spacing="1.5">EXPORT</text>
      <text x="24" y="96" fill="#ffffff" font-size="21" font-weight="700">Code to Git</text>
      <text x="24" y="128" fill="#9aa4c6" font-size="15">Connect Lovable to</text>
      <text x="24" y="150" fill="#9aa4c6" font-size="15">GitHub — your repo.</text>
    </g>
    <line x1="272" y1="248" x2="330" y2="248" stroke="#7C5CFF" stroke-width="2.5" marker-end="url(#sarrow)"/>
    <g transform="translate(336,150)">
      <rect width="232" height="196" rx="16" fill="#ffffff0a" stroke="#ffffff26"/>
      <circle cx="34" cy="40" r="18" fill="#4F1AF3"/><text x="34" y="47" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">2</text>
      <text x="66" y="46" fill="#7C5CFF" font-size="13" font-weight="600" letter-spacing="1.5">SERVER</text>
      <text x="24" y="96" fill="#ffffff" font-size="21" font-weight="700">Managed server</text>
      <text x="24" y="128" fill="#9aa4c6" font-size="15">Pick your cloud and</text>
      <text x="24" y="150" fill="#9aa4c6" font-size="15">region, point to repo.</text>
    </g>
    <line x1="568" y1="248" x2="626" y2="248" stroke="#7C5CFF" stroke-width="2.5" marker-end="url(#sarrow)"/>
    <g transform="translate(632,150)">
      <rect width="232" height="196" rx="16" fill="#ffffff0a" stroke="#ffffff26"/>
      <circle cx="34" cy="40" r="18" fill="#4F1AF3"/><text x="34" y="47" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">3</text>
      <text x="66" y="46" fill="#7C5CFF" font-size="13" font-weight="600" letter-spacing="1.5">DATA</text>
      <text x="24" y="96" fill="#ffffff" font-size="21" font-weight="700">DB + secrets</text>
      <text x="24" y="128" fill="#9aa4c6" font-size="15">Attach a managed DB,</text>
      <text x="24" y="150" fill="#9aa4c6" font-size="15">set env vars safely.</text>
    </g>
    <line x1="864" y1="248" x2="922" y2="248" stroke="#7C5CFF" stroke-width="2.5" marker-end="url(#sarrow)"/>
    <g transform="translate(928,150)">
      <rect width="232" height="196" rx="16" fill="#4F1AF314" stroke="#7C5CFF55"/>
      <circle cx="34" cy="40" r="18" fill="#40B75F"/>
      <path d="M27 40 l5 5 l9 -10" fill="none" stroke="#04140a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="46" fill="#40B75F" font-size="13" font-weight="600" letter-spacing="1.5">LIVE</text>
      <text x="24" y="96" fill="#ffffff" font-size="21" font-weight="700">Deploy + domain</text>
      <text x="24" y="128" fill="#c9d2ee" font-size="15">Free SSL + CI/CD on</text>
      <text x="24" y="150" fill="#c9d2ee" font-size="15">every push.</text>
    </g>
  </g>

  <g transform="translate(40,392)">
    <rect x="0" y="0" width="1120" height="44" rx="12" fill="#4F1AF314" stroke="#7C5CFF44"/>
    <text x="24" y="29" fill="#cbd3ee" font-size="16" font-weight="500">Your code, your data, your server — no per-app pricing, no lock-in. Move it anytime.</text>
  </g>
</svg>
